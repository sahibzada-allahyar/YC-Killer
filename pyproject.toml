[project]
name = "millennium-harness"
version = "0.0.1"
description = "Done means proved: a model-free verification gate for AI-written Lean and Dafny, and verified recursive self-improvement."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "hypothesis==6.168.5",
  "anthropic>=0.70",
]

[project.optional-dependencies]
z3 = ["hypothesis-crosshair==0.0.31", "crosshair-tool==0.0.111"]
dev = ["pytest>=8"]

[project.scripts]
millennium-harness = "millennium_harness.cli:main"
millennium-rsi = "millennium_rsi.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["millennium_harness", "millennium_rsi"]
